name: Scheduled diagnostics

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  source_scan:
    name: Current source scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install checksum-pinned gitleaks
        run: bash ops/ci/install-gitleaks.sh
      - name: Scan source and lockfiles
        run: bash scripts/ci-local.sh source-scan
      - name: Validate observation
        if: ${{ always() }}
        run: bash ops/ci/artifact-check.sh source-scan "$GITHUB_SHA"
      - name: Stage exact sanitized diagnostics
        id: stage
        if: ${{ always() }}
        run: bash ops/ci/stage-artifacts.sh source-scan "$GITHUB_SHA"
      - name: Upload diagnostics
        if: ${{ always() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-scheduled-source-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-upload/source-scan/
          include-hidden-files: true
          if-no-files-found: error

  history:
    name: Full-history secret scan
    needs: source_scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful current-source scan
        shell: bash
        env:
          SOURCE_SCAN_RESULT: ${{ needs.source_scan.result }}
        run: |
          [[ "$SOURCE_SCAN_RESULT" == success ]] || {
            echo "::error::current-source scan did not succeed: $SOURCE_SCAN_RESULT"
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned gitleaks
        run: bash ops/ci/install-gitleaks.sh
      - name: Scan full history
        run: bash scripts/ci-local.sh history
      - name: Validate observation
        if: ${{ always() }}
        run: bash ops/ci/artifact-check.sh history "$GITHUB_SHA"
      - name: Stage exact sanitized diagnostics
        id: stage
        if: ${{ always() }}
        run: bash ops/ci/stage-artifacts.sh history "$GITHUB_SHA"
      - name: Upload diagnostics
        if: ${{ always() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-upload/history/
          include-hidden-files: true
          if-no-files-found: error

  links:
    name: External links
    needs: source_scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful current-source scan
        shell: bash
        env:
          SOURCE_SCAN_RESULT: ${{ needs.source_scan.result }}
        run: |
          [[ "$SOURCE_SCAN_RESULT" == success ]] || {
            echo "::error::current-source scan did not succeed: $SOURCE_SCAN_RESULT"
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: lychee@0.24.0
          fallback: none
      - name: Check external links
        run: bash scripts/ci-local.sh links
      - name: Validate observation
        if: ${{ always() }}
        run: bash ops/ci/artifact-check.sh links "$GITHUB_SHA"
      - name: Stage exact sanitized diagnostics
        id: stage
        if: ${{ always() }}
        run: bash ops/ci/stage-artifacts.sh links "$GITHUB_SHA"
      - name: Upload diagnostics
        if: ${{ always() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-links-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-upload/links/
          include-hidden-files: true
          if-no-files-found: error

  advisory:
    name: RustSec advisories
    needs: source_scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful current-source scan
        shell: bash
        env:
          SOURCE_SCAN_RESULT: ${{ needs.source_scan.result }}
        run: |
          [[ "$SOURCE_SCAN_RESULT" == success ]] || {
            echo "::error::current-source scan did not succeed: $SOURCE_SCAN_RESULT"
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny@0.19.8
          fallback: none
      - name: Refresh and scan advisory database
        run: bash scripts/ci-local.sh advisory
      - name: Validate observation
        if: ${{ always() }}
        run: bash ops/ci/artifact-check.sh advisory "$GITHUB_SHA"
      - name: Stage exact sanitized diagnostics
        id: stage
        if: ${{ always() }}
        run: bash ops/ci/stage-artifacts.sh advisory "$GITHUB_SHA"
      - name: Upload diagnostics
        if: ${{ always() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-upload/advisory/
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Workspace coverage
    needs: source_scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful current-source scan
        shell: bash
        env:
          SOURCE_SCAN_RESULT: ${{ needs.source_scan.result }}
        run: |
          [[ "$SOURCE_SCAN_RESULT" == success ]] || {
            echo "::error::current-source scan did not succeed: $SOURCE_SCAN_RESULT"
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.137,cargo-llvm-cov@0.8.7
          fallback: none
      - name: Generate sanitized coverage report
        run: bash scripts/ci-local.sh coverage
      - name: Validate report and observation
        if: ${{ always() }}
        run: bash ops/ci/artifact-check.sh coverage "$GITHUB_SHA"
      - name: Stage exact sanitized diagnostics
        id: stage
        if: ${{ always() }}
        run: bash ops/ci/stage-artifacts.sh coverage "$GITHUB_SHA"
      - name: Upload diagnostics
        if: ${{ always() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-upload/coverage/
          include-hidden-files: true
          if-no-files-found: error

  macos:
    name: macOS compile and typed refusal
    needs: source_scan
    if: ${{ always() }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Require successful current-source scan
        shell: bash
        env:
          SOURCE_SCAN_RESULT: ${{ needs.source_scan.result }}
        run: |
          [[ "$SOURCE_SCAN_RESULT" == success ]] || {
            echo "::error::current-source scan did not succeed: $SOURCE_SCAN_RESULT"
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.12"
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.95.0
          components: clippy
      - name: Compile and prove typed mutation refusal
        shell: bash
        run: bash scripts/ci-local.sh platform
      - name: Validate observation
        if: ${{ always() }}
        shell: bash
        run: bash ops/ci/artifact-check.sh platform "$GITHUB_SHA"
      - name: Stage exact sanitized diagnostics
        id: stage
        if: ${{ always() }}
        shell: bash
        run: bash ops/ci/stage-artifacts.sh platform "$GITHUB_SHA"
      - name: Upload diagnostics
        if: ${{ always() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-macos-refusal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-upload/platform/
          include-hidden-files: true
          if-no-files-found: error

  windows:
    name: Windows compile and typed refusal
    needs: source_scan
    if: ${{ always() }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Require successful current-source scan
        shell: bash
        env:
          SOURCE_SCAN_RESULT: ${{ needs.source_scan.result }}
        run: |
          [[ "$SOURCE_SCAN_RESULT" == success ]] || {
            echo "::error::current-source scan did not succeed: $SOURCE_SCAN_RESULT"
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.12"
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.95.0
          components: clippy
      - name: Compile and prove typed mutation refusal
        shell: bash
        run: bash scripts/ci-local.sh platform
      - name: Validate observation
        if: ${{ always() }}
        shell: bash
        run: bash ops/ci/artifact-check.sh platform "$GITHUB_SHA"
      - name: Stage exact sanitized diagnostics
        id: stage
        if: ${{ always() }}
        shell: bash
        run: bash ops/ci/stage-artifacts.sh platform "$GITHUB_SHA"
      - name: Upload diagnostics
        if: ${{ always() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-windows-refusal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-upload/platform/
          include-hidden-files: true
          if-no-files-found: error

  audit:
    name: Jankurai audit
    needs: source_scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful current-source scan
        shell: bash
        env:
          SOURCE_SCAN_RESULT: ${{ needs.source_scan.result }}
        run: |
          [[ "$SOURCE_SCAN_RESULT" == success ]] || {
            echo "::error::current-source scan did not succeed: $SOURCE_SCAN_RESULT"
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve the pinned auditor or refuse neutral
        shell: bash
        run: |
          command -v jankurai >/dev/null 2>&1 || {
            echo "::error::AUDITOR_UNAVAILABLE_HOSTED: jankurai 1.6.11 is a machine-local build with no checksum-pinned hosted artifact; the audit lane did not run"
            exit 78
          }
      - name: Run committed-policy audit
        run: bash scripts/ci-local.sh audit
      - name: Validate observation
        if: ${{ always() }}
        run: bash ops/ci/artifact-check.sh audit "$GITHUB_SHA"
      - name: Stage exact sanitized diagnostics
        id: stage
        if: ${{ always() }}
        run: bash ops/ci/stage-artifacts.sh audit "$GITHUB_SHA"
      - name: Upload diagnostics
        if: ${{ always() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-upload/audit/
          include-hidden-files: true
          if-no-files-found: error
