[[zone]]
path = "docs/assurance/invariant-crosswalk.generated.md"
source = "policy/v1alpha1/invariant-registry.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "docs/assurance/release-truth.generated.md"
source = "src/check/prerequisites.rs + src/check/truth/rows.rs + family.lock + repos.manifest.toml + docs/release.md + docs/assurance/product-gaps.md"
command = "just release-truth"
read_only = true

[[zone]]
path = "docs/assurance/corpus-coverage.generated.md"
source = "policy/corpus-coverage-v1.json + src/check/corpus/"
command = "bash scripts/corpus-coverage.sh write"
read_only = true

[[zone]]
path = "docs/assurance/orphan-inventory.generated.md"
source = "scripts/orphan-inventory.sh + tests/orphan_inventory/"
command = "bash scripts/orphan-inventory.sh write"
read_only = true

[[zone]]
path = "formal/traces/"
source = "formal/*.tla + formal/*.cfg + formal/toolchain.lock.json + formal/model-lock.json"
command = "just model-check"
read_only = true

