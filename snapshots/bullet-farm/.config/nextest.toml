[profile.fast]
# Admit a bounded workload even on high-core-count development hosts.
test-threads = 4
fail-fast = false
junit = { path = "junit.xml" }

[profile.contract]
fail-fast = false
junit = { path = "junit.xml" }

[test-groups]
media-capture = { max-threads = 1 }

[[profile.fast.overrides]]
filter = 'binary(=demo_gif_recording) | binary(=demo_gif_rendering) | binary(=demo_gif_portal_capture)'
test-group = 'media-capture'
# Capture owns the whole fast budget; other tests cannot contend with it.
threads-required = 4
