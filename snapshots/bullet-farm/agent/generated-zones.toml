# Generated artifacts that must be repaired from their source, never hand-edited.
[[zone]]
path = "generated/zones/family.lock.txt"
source = "family.lock"
command = "cargo run --locked --quiet --bin bullet-family -- lock generate --tag <version> --subjects <absolute-path>"
read_only = true

[[zone]]
path = "generated/zones/fusion.txt"
source = "repos.manifest.toml + family.lock + exact member checkouts"
command = "bash scripts/fuse.sh --source local"
read_only = true

[[zone]]
path = "generated/zones/schema-bundle.txt"
source = "contracts/v1alpha1/schema-bundle.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "contracts/v1alpha1/bundle-manifest.json"
source = "contracts/v1alpha1/contract-catalog.json + contracts/v1alpha1/bundle-manifest.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "contracts/generated/"
source = "contracts/v1alpha1/contract-catalog.json + policy/v1alpha1/invariant-registry.json + policy/v1alpha1/policy-template.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "generated/zones/policy.txt"
source = "policy/v1alpha1/policy.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "fixtures/hostile/cases/"
source = "crates/bullet-wire/src/contract_tool.rs"
command = "just contract-generate"
read_only = true

[[zone]]
path = "generated/zones/fixture-manifest.txt"
source = "fixtures/hostile/fixture-manifest.json"
command = "just contract-generate"
read_only = true

[[zone]]
path = "generated/zones/canonical-golden.txt"
