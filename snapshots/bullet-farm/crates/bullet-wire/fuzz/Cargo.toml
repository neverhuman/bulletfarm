[workspace]

[package]
name = "bullet-wire-fuzz"
description = "Standalone corpus replay for decode_canonical_value."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
bullet-wire = { path = ".." }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
