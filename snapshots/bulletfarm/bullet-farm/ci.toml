# Prepared Jeryu-native graph. Every job refuses with exit 78 until forge and
# public-mirror ratification, immutable provisioning, runner activation, and
# protected-context API read-back exist. This file registers nothing.

[[job]]
id = "activation"
name = "prepared activation refusal"
runner_class = "native-rust-clean"
run = ["bash ops/ci/jeryu-activation-gate.sh"]
cache_mounts = []
artifact_paths = []

[[job]]
id = "source_scan"
name = "prepared source scan"
runner_class = "native-rust-clean"
needs = ["activation"]
run = ["bash ops/ci/jeryu-activation-gate.sh", "bash scripts/ci-local.sh source-scan"]
cache_mounts = []
artifact_paths = [".ci-artifacts/observations/source-scan.json"]

[[job]]
id = "fast"
name = "prepared fast"
runner_class = "native-rust-clean"
needs = ["source_scan"]
run = ["bash ops/ci/jeryu-activation-gate.sh", "bash scripts/ci-local.sh fast"]
cache_mounts = []
artifact_paths = [".ci-artifacts/observations/fast.json", ".ci-artifacts/junit/fast.xml"]

[[job]]
id = "lint"
name = "prepared lint"
runner_class = "native-rust-clean"
needs = ["source_scan"]
run = ["bash ops/ci/jeryu-activation-gate.sh", "bash ops/ci/install-readme-jsonschema.sh", "PATH=\"$PWD/target/.ci-tools/readme-jsonschema/bin:$PATH\" bash scripts/ci-local.sh lint"]
cache_mounts = []
artifact_paths = [".ci-artifacts/observations/lint.json"]

[[job]]
id = "contract"
name = "prepared contract"
runner_class = "native-rust-clean"
needs = ["source_scan"]
run = ["bash ops/ci/jeryu-activation-gate.sh", "bash scripts/ci-local.sh contract"]
cache_mounts = []
artifact_paths = [".ci-artifacts/observations/contract.json", ".ci-artifacts/junit/contract.xml", ".ci-artifacts/formal/contract.json", ".ci-artifacts/formal/contract.log", ".ci-artifacts/contracts/bundle-manifest.json"]

[[job]]
id = "security"
name = "prepared security"
runner_class = "native-rust-clean"
needs = ["source_scan"]
run = ["bash ops/ci/jeryu-activation-gate.sh", "bash scripts/ci-local.sh security"]
cache_mounts = []
artifact_paths = [".ci-artifacts/observations/security.json"]

[[job]]
id = "docs"
name = "prepared docs"
runner_class = "native-rust-clean"
needs = ["source_scan"]
run = ["bash ops/ci/jeryu-activation-gate.sh", "bash ops/ci/install-readme-jsonschema.sh", "PATH=\"$PWD/target/.ci-tools/readme-jsonschema/bin:$PATH\" bash scripts/ci-local.sh docs"]
cache_mounts = []
artifact_paths = [".ci-artifacts/observations/docs.json"]

[[job]]
id = "required"
name = "prepared required convergence refusal"
runner_class = "native-rust-clean"
needs = ["source_scan", "fast", "lint", "contract", "security", "docs"]
run = ["bash ops/ci/jeryu-activation-gate.sh"]
cache_mounts = []
artifact_paths = []
