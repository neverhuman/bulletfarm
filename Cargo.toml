[package]
name = "bf"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
description = "BulletFarm — one command, one hub, one workbench"
repository = "https://github.com/neverhuman/bulletfarm"
default-run = "bf"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "bf"
path = "src/main.rs"
